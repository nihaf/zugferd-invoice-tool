<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:lang="${#locale.language}"
      data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" th:content="#{app.description}">
    <meta name="theme-color" content="#9b4dca">
    <title th:block th:fragment="title">E-Rechnung Tool</title>

    <!-- Pico CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Noto Sans Font -->
    <link rel="stylesheet" th:href="@{/fonts/noto-sans.css}">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Skip Link for Accessibility -->
    <a href="#main-content" class="skip-link" th:text="#{accessibility.skipToContent}">Skip to main content</a>

    <!-- Header -->
    <header class="container">
        <nav>
            <ul>
                <li>
                    <a th:href="@{/}" class="brand">
                        <span class="brand-icon" aria-hidden="true">&#128196;</span>
                        <strong th:text="#{app.title}">E-Rechnung Tool</strong>
                    </a>
                </li>
            </ul>
            <ul>
                <li>
                    <div class="locale-switcher" role="group" aria-label="Language selection">
                        <a th:href="@{/locale(lang='de')}" role="button"
                           th:classappend="${#locale.language == 'de'} ? '' : 'outline'"
                           th:aria-current="${#locale.language == 'de'} ? 'true' : 'false'">DE</a>
                        <a th:href="@{/locale(lang='en')}" role="button"
                           th:classappend="${#locale.language == 'en'} ? '' : 'outline'"
                           th:aria-current="${#locale.language == 'en'} ? 'true' : 'false'">EN</a>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Flash Messages -->
    <th:block th:if="${message != null or error != null}">
        <div class="container">
            <article th:if="${message}" class="alert-success">
                <span th:text="#{${message}}">Message</span>
            </article>
            <article th:if="${error}" class="alert-error">
                <span th:text="${#messages.msgOrNull(error)} ?: ${error}">Error</span>
            </article>
        </div>
    </th:block>

    <!-- Main Content -->
    <main id="main-content" class="container">
        <div layout:fragment="content">
            <!-- Page content will be inserted here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="container">
        <p>
            <span th:text="#{app.title}">E-Rechnung Tool</span>
            <span class="separator">&middot;</span>
            ZUGFeRD 2.3 / Factur-X
            <span class="separator">&middot;</span>
            <span th:text="#{footer.powered}">Powered by Mustang</span>
        </p>
    </footer>

    <!-- Locale Switcher JS -->
    <script th:src="@{/js/locale-switcher.js}"></script>

    <!-- Page-specific scripts -->
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
